# One VPS, one command: docker compose up -d --build
# Caddy gets an HTTPS certificate for DOMAIN by itself; point the domain's A record at this server first.
services:
  dash:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      TRUST_PROXY: "1"        # Caddy sits in front, so read the visitor's address from X-Forwarded-For
    volumes:
      - dash-data:/app/data
    expose:
      - "8787"                # only Caddy can reach it; nothing is published to the internet directly

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - dash
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. DOMAIN=squeek.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  dash-data:
  caddy-data:
  caddy-config:
